  /integrations/v1/whatsapp-customer-api/customer-auth/otp/resend:
    post:
      tags:
        - Autenticación de Clientes WhatsApp
      summary: Reenviar OTP
      description: |
        Reenvía un nuevo OTP al email del cliente.

        **Reglas de Reenvío:**
        - Invalida el OTP anterior
        - Genera nuevo OTP con nueva expiración de 5 minutos
        - Resetea contador de intentos a 3
        - Mismo email que el OTP original
      operationId: resendOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpResendBody"
            examples:
              resend_request:
                summary: Solicitud de reenvío
                value:
                  cedula: "8-123-456"
      security:
        - ApiKeyAuth:
            - "/v1/whatsapp-customer-api/customer-auth/otp/resend:write"
      responses:
        "200":
          description: OTP reenviado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpResendResponse"
              examples:
                resend_success:
                  summary: Reenvío exitoso
                  value:
                    success: true
                    otpResent: true
                    maskedEmail: "leid******@gmail.com"
                    newExpiresIn: 300
                    maxRetries: 3
                    message: "Nuevo OTP enviado al email registrado"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: API Key inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No hay OTP activo para reenviar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                no_active_otp:
                  summary: Sin OTP activo
                  value:
                    success: false
                    error: "NO_ACTIVE_OTP"
                    message: "No hay un OTP activo para esta cédula. Solicite uno nuevo."
        "429":
          description: Rate limit excedido - Siempre se toma en cuenta como error de límite de velocidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

