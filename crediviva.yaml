  # =====================================================
  # WHATSAPP CUSTOMER APIS
  # =====================================================
  /integrations/v1/whatsapp-customer-api/customer-auth/verify-phone:
    get:
      tags:
        - Autenticación de Clientes WhatsApp
      summary: Verificar si teléfono está registrado
      description: |
        Verifica si un número de teléfono está registrado en el sistema y determina 
        el tipo de autenticación requerida.

        **Reglas de Validación:**
        - Teléfono debe tener formato exacto: +507XXXXXXXX
        - Prefijo +507 es OBLIGATORIO seguido de exactamente 8 dígitos
        - NO se acepta ningún otro formato (sin espacios, guiones, paréntesis)
      operationId: verifyPhone
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\+507[0-9]{8}$"
          description: |
            Número de teléfono con formato exacto requerido:
            - OBLIGATORIO: +507 seguido de exactamente 8 dígitos
            - Ejemplo válido: +50769442422
            - NO se acepta ningún otro formato
          examples:
            valid_format:
              summary: Formato exacto válido
              value: "+50769442422"
            another_valid:
              summary: Otro número válido
              value: "+50712345678"
            third_valid:
              summary: Tercer ejemplo válido
              value: "+50787654321"
      security:
        - ApiKeyAuth:
            - "/v1/whatsapp-customer-api/customer-auth/verify-phone:read"
      responses:
        "200":
          description: Verificación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyPhoneResponse"
              examples:
                registered:
                  summary: Cliente registrado
                  value:
                    success: true
                    authType: 1
                    message: "Número registrado en sistema"
                not_registered:
                  summary: Cliente no registrado
                  value:
                    success: true
                    authType: 2
                    message: "Número no registrado, se requiere información adicional"
        "400":
          description: Formato de teléfono inválido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_phone:
                  summary: Formato inválido
                  value:
                    success: false
                    error: "INVALID_PHONE_FORMAT"
                    message: "El formato del teléfono no es válido"
        "401":
          description: API Key inválida o faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_api_key:
                  summary: API Key inválida
                  value:
                    success: false
                    error: "INVALID_API_KEY"
                    message: "API Key inválida o faltante"
        "429":
          description: Rate limit excedido - Siempre se toma en cuenta como error de límite de velocidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                rate_limit:
                  summary: Límite excedido
                  value:
                    success: false
                    error: "RATE_LIMIT_EXCEEDED"
                    message: "Límite de solicitudes excedido. Intente nuevamente más tarde."
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /integrations/v1/whatsapp-customer-api/customer-auth/authenticate:
    get:
      tags:
        - Autenticación de Clientes WhatsApp
      summary: Autenticar cliente
      description: |
        Autentica un cliente usando diferentes niveles de información según 
        su estado de registro.

        **Escenarios:**
        - **Tipo 1 (Registrado)**: teléfono + cédula + fecha nacimiento
        - **Tipo 2 (No registrado)**: Debe PRIMERO completar flujo OTP, luego teléfono + cédula + fecha nacimiento + email

        **Flujo Completo Tipo 2:**
        1. POST /otp/request → Solicitar OTP con cédula
        2. POST /otp/verify → Verificar OTP y obtener tempToken
        3. GET /authenticate → Autenticación completa con todos los datos

        **Reglas de Matching:**
        - Coincidencia 100% exacta requerida
        - Todos los campos tienen el mismo peso
        - 3-5 intentos fallidos → pausa de 10 minutos

        **Formato de Cédulas:**
        - Ingresar exactamente como aparece en el documento físico
        - Incluir guiones, puntos, letras según corresponda al documento
        - Ejemplos: 8-123-456, PE-1-234-567, 1-234-567, E-8-12345
        - NO modificar el formato del documento original
      operationId: authenticateCustomer
      parameters:
        - name: phone
          in: query
          required: true
          schema:
            type: string
            pattern: "^\\+507[0-9]{8}$"
          description: |
            Número de teléfono con formato exacto requerido:
            - OBLIGATORIO: +507 seguido de exactamente 8 dígitos
            - Ejemplo válido: +50769442422
            - NO se acepta ningún otro formato
          example: "+50769442422"
        - name: cedula
          in: query
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9\\-\\.\\s]+$"
          description: |
            Cédula exactamente como aparece en el documento físico:
            - Incluir guiones, puntos, letras según el documento original
            - Ejemplos válidos: 8-123-456, PE-1-234-567, 1-234-567, E-8-12345
            - NO modificar el formato del documento físico
          example: "8-123-456"
        - name: birthDate
          in: query
          required: false
          schema:
            type: string
            format: date
            pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
          description: |
            Fecha de nacimiento en formato exacto:
            - Formato obligatorio: YYYY-MM-DD (año-mes-día)
            - Ejemplo válido: 1983-02-27
            - Requerido solo para clientes NO registrados (Tipo 2)
          example: "1983-02-27"
        - name: email
          in: query
          required: false
          schema:
            type: string
            format: email
          description: |
            Correo electrónico válido
            - Requerido solo para clientes NO registrados (Tipo 2)
          example: "cliente@email.com"
      security:
        - ApiKeyAuth:
            - "/v1/whatsapp-customer-api/customer-auth/authenticate:read"
      responses:
        "200":
          description: Autenticación procesada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthenticateResponse"
              examples:
                success:
                  summary: Autenticación exitosa
                  value:
                    success: true
                    authenticated: true
                    sessionToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    clientId: "12345"
                    attemptsRemaining: 5
                    message: "Cliente autenticado correctamente"
                failed:
                  summary: Autenticación fallida
                  value:
                    success: false
                    authenticated: false
                    sessionToken: null
                    clientId: null
                    attemptsRemaining: 3
                    message: "Los datos ingresados no coinciden con nuestros registros"
        "400":
          description: Datos de solicitud inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_data:
                  summary: Datos inválidos
                  value:
                    success: false
                    error: "INVALID_REQUEST_DATA"
                    message: "Los datos enviados no tienen el formato correcto"
        "401":
          description: API Key inválida o faltante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cliente no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                customer_not_found:
                  summary: Cliente no encontrado
                  value:
                    success: false
                    error: "CUSTOMER_NOT_FOUND"
                    message: "No se encontró un cliente con los datos proporcionados"
        "422":
          description: Datos no coinciden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                data_mismatch:
                  summary: Datos no coinciden
                  value:
                    success: false
                    error: "AUTH_DATA_MISMATCH"
                    message: "Los datos ingresados no coinciden con nuestros registros"
        "429":
          description: Rate limit excedido - Siempre se toma en cuenta como error de límite de velocidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /integrations/v1/whatsapp-customer-api/customer-auth/otp/request:
    post:
      tags:
        - Autenticación de Clientes WhatsApp
      summary: Solicitar OTP para cliente no registrado
      description: |
        Solicita un OTP para clientes con teléfono no registrado (Tipo 2).

        **Flujo:**
        1. Cliente ingresa cédula
        2. Sistema busca email asociado en DB
        3. Envía OTP de 4 dígitos al email
        4. Retorna email ofuscado para confirmación

        **Configuración OTP:**
        - **Dígitos**: 4 números
        - **Expiración**: 5 minutos
        - **Máximo reintentos**: 3
        - **Reenvío**: Permitido
      operationId: requestOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequestBody"
            examples:
              valid_cedula:
                summary: Cédula válida en sistema
                value:
                  cedula: "8-123-456"
      security:
        - ApiKeyAuth:
            - "/v1/whatsapp-customer-api/customer-auth/otp/request:write"
      responses:
        "200":
          description: OTP enviado exitosamente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
              examples:
                otp_sent:
                  summary: OTP enviado
                  value:
                    success: true
                    otpSent: true
                    maskedEmail: "leid******@gmail.com"
                    expiresIn: 300
                    maxRetries: 3
                    message: "OTP enviado al email registrado"
        "400":
          description: Datos inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_cedula_format:
                  summary: Formato de cédula inválido
                  value:
                    success: false
                    error: "INVALID_CEDULA_FORMAT"
                    message: "El formato de cédula no es válido"
        "401":
          description: API Key inválida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cédula no encontrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cedula_not_found:
                  summary: Cédula no registrada
                  value:
                    success: false
                    error: "CEDULA_NOT_FOUND"
                    message: "La cédula no está registrada en el sistema"
        "429":
          description: Rate limit excedido - Siempre se toma en cuenta como error de límite de velocidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /integrations/v1/whatsapp-customer-api/customer-auth/otp/verify:
    post:
      tags:
        - Autenticación de Clientes WhatsApp
      summary: Verificar OTP ingresado
      description: |
        Verifica el OTP ingresado por el cliente para validar su identidad.

        **Reglas de Validación:**
        - OTP debe ser exactamente 4 dígitos
        - Máximo 3 intentos por OTP generado
        - OTP expira en 5 minutos
        - Después de 3 fallos, debe solicitar nuevo OTP
      operationId: verifyOtp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpVerifyBody"
            examples:
              valid_otp:
                summary: OTP válido
                value:
                  cedula: "8-123-456"
                  otp: "1234"
      security:
        - ApiKeyAuth:
            - "/v1/whatsapp-customer-api/customer-auth/otp/verify:write"
      responses:
        "200":
          description: Verificación de OTP procesada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpVerifyResponse"
              examples:
                otp_valid:
                  summary: OTP válido
                  value:
                    success: true
                    otpValid: true
                    tempToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                    attemptsRemaining: 2
                    message: "OTP verificado correctamente. Proceder con autenticación completa."
                otp_invalid:
                  summary: OTP inválido
