paths:
  /api-caja/get-balance:
    post:
      tags:
        - CAJA
      summary: Obtener saldo del cliente
      description: Obtiene el saldo asociado al cliente
      operationId: get-balance
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Get_Balance"
      security:
        - bearerHttpAuthentication:
            - "/api-caja/get-balance:read"
        - defaultApiKey:
            - "/api-caja/get-balance:read"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetBalance"
                  - $ref: "#/components/schemas/GetBalanceAlreadyPaid"
                  - $ref: "#/components/schemas/GetBalanceWriteOff"
        "400":
          description: No se ha proporcionado el número de cédula en la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceNoIdNumber"
        "403":
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceForbidden"
        "500":
          description: Error al conectarse a base de datos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetBalanceErrorConnectingDb"
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetBalanceUserNotFound"
                  - $ref: "#/components/schemas/GetBalanceCreditNotFound"
                  - $ref: "#/components/schemas/GetBalanceInstallmentsNotFound"
  /api-caja/get-payment-methods:
    get:
      tags:
        - CAJA
      summary: Obtener métodos de pago disponibles
      description: Obtiene la lista de métodos de pago disponibles
      operationId: get-payment-methods
      security:
        - bearerHttpAuthentication:
            - "/api-caja/get-payment-methods:read"
        - defaultApiKey:
            - "/api-caja/get-payment-methods:read"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPaymentMethods"
        "400":
          description: No se ha proporcionado los parametros correspondientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPaymentMethods"
        "500":
          description: Error al obtener los metodos de pago
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetPaymentMethodsError"
  /api-caja/make-payment:
    post:
      tags:
        - CAJA
      summary: Realizar un pago
      description: Procesa un pago asociado al cliente
      operationId: make-payment
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Make_Payment"
      security:
        - bearerHttpAuthentication:
            - "/api-caja/make-payment:write"
        - defaultApiKey:
            - "/api-caja/make-payment:write"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MakePayment"

        "400":
          description: No se ha proporcionado los parametros correspondientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MakePaymentNoParameters"
        "403":
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MakePaymentForbidden"
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MakePaymentUserNotFound"
                  - $ref: "#/components/schemas/MakePaymentCreditNotFound"
        "500":
          description: Error al realizar la solicitud
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MakePaymentErroConnectingDb"
                  - $ref: "#/components/schemas/MakePaymentErroGettingReceipt"
                  - $ref: "#/components/schemas/MakePaymentErroSendingEmail"
                  - $ref: "#/components/schemas/MakePaymentErroMakingPayment"
                  - $ref: "#/components/schemas/MakePaymentErroGettingTransaction"
        "422":
          description: Error al procesar la solicitud
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MakePaymentErroTransactionAmount"
  /integrations/payment/get-balance/punto-pago:
    post:
      tags:
        - PUNTO PAGO
      summary: Obtener saldo del cliente
      description: Obtiene el saldo asociado al cliente
      operationId: get-balance-punto-pago
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Get_Balance_Punto_Pago"
      security:
        - defaultApiKey:
            - /integrations/payment/get-balance/punto-pago:read
        - defaultApiKey:
            - /integrations/payment/get-balance/punto-pago:read
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetBalancePuntoPago"
                  - $ref: "#/components/schemas/GetBalanceAlreadyPaidPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceWriteOffPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceNoIdNumberPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceForbiddenPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceErrorConnectingDbPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceUserNotFoundPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceCreditNotFoundPuntoPago"
                  - $ref: "#/components/schemas/GetBalanceInstallmentsNotFoundPuntoPago"
  /integrations/payment/make-payment/punto-pago:
    post:
      tags:
        - PUNTO PAGO
      summary: Realizar un pago
      description: Procesa un pago asociado al cliente
      operationId: make-payment-punto-pago
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Make_Payment_Punto_Pago"
      security:
        - defaultApiKey:
            - /integrations/payment/make-payment/punto-pago:write
        - defaultApiKey:
            - /integrations/payment/make-payment/punto-pago:write
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/MakePaymentPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentErroConnectingDbPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentErroGettingReceiptPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentErroSendingEmailPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentErroMakingPaymentPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentErroGettingTransactionPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentNoParametersPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentForbiddenPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentUserNotFoundPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentCreditNotFoundPuntoPago"
                  - $ref: "#/components/schemas/MakePaymentErroTransactionAmountPuntoPago"
  /pull/create-qr:
    post:
      tags:
        - PULL
        - PULL
      summary: Generar código QR
      description: Genera el código qr que será escaneado por el cliente
      operationId: create-qr-code
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Create_Qr_Code"
      security:
        - bearerHttpAuthentication:
            - "/pull/create-qr:write"
        - bearerHttpAuthentication:
            - "/pull/create-qr:write"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQrCode"
        "400":
          description: La solicitud no puede ser procesada debido a uno o más errores en los parámetros enviados.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreateQrCodeNoParameters"
                  - $ref: "#/components/schemas/CreateQrCodeWrongType"
        "403":
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQrCodeForbidden"
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQrCodeCommerceNotFound"
        "500":
          description: Error al realizar la solicitud
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CreateQrCodeErrorConnectingDb"
                  - $ref: "#/components/schemas/CreateQrCodeErrorCreatingQR"
        "422":
          description: Error al procesar la solicitud
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateQrCodeErrorTransactionAmount"
  /pull/get-info-qr:
    post:
      tags:
        - PULL
      summary: Obtener información código QR
      description: Obtiene la información del estado del QR y desembolso
      operationId: get-info-qr
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Get_Info_Qr"
      security:
        - bearerHttpAuthentication:
            - "/pull/get-info-qr:read"
        - bearerHttpAuthentication:
            - "/pull/get-info-qr:read"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInfoQr"
        "400":
          description: No se ha proporcionado los parametros correspondientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInfoQrNoParameters"
        "403":
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInfoQrForbidden"
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetInfoQrDisbursementNotFound"
        "500":
          description: Error al realizar la solicitud
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/GetInfoQrErrorConnectingDb"
                  - $ref: "#/components/schemas/GetInfoQrErrorGettingQR"
  /pull/cancel-qr:
    post:
      tags:
        - PULL
      summary: Cancelar código QR
      description: Cancela el código QR generado
      operationId: cancel-qr-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cancel_Qr"
      security:
        - bearerHttpAuthentication:
            - "/pull/cancel-qr:write"
        - bearerHttpAuthentication:
            - "/pull/cancel-qr:write"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelQr"
        "400":
          description: No se ha proporcionado los parametros correspondientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelQrNoParameters"
        "403":
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelQrForbidden"
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelQrNotFound"
        "500":
          description: Error al realizar la solicitud
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CancelQrErrorConnectingDb"
                  - $ref: "#/components/schemas/CancelQrErrorCancellingQR"
  /pull/cancel-credit:
    post:
      tags:
        - PULL
      summary: Cancelar crédito
      description: Cancela el crédito activado asociado a la transacción
      operationId: cancel-credit-pull
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cancel_Credit"
      security:
        - bearerHttpAuthentication:
            - "/pull/cancel-credit:write"
      responses:
        "200":
          description: Operación exitosa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCredit"
        "400":
          description: No se ha proporcionado los parametros correspondientes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCreditNoParameters"
        "403":
          description: Sin permisos para acceder al recurso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCreditForbidden"
        "404":
          description: Recurso no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCreditNotFound"
        "409":
          description: Crédito no puede ser cancelado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/CancelCreditNotActive"
                  - $ref: "#/components/schemas/CancelCreditHasPayments"
                  - $ref: "#/components/schemas/CancelCreditTopup"
        "500":
          description: Error al cancelar la transacción
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCreditErrorCancellingCredit"
  /red-digital/create-qr:
    post:
      tags:
        - RED DIGITAL
      summary: Generar código QR
      description: Genera el código qr que será escaneado por el cliente
      operationId: red-digital-create-qr-code
