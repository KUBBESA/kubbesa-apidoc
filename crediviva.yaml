  /integrations/v1/whatsapp-customer-api/document-service/cancellation-letter:
    get:
      tags:
        - Servicios de Documentos WhatsApp
      summary: Obtener carta de cancelación
      description: |
        Obtiene una carta de cancelación para clientes con crédito cerrado.

        **Reglas de Negocio:**
        - Solo disponible para clientes con crédito CERRADO
        - Si el crédito está activo, retorna error específico
        - Información del destinatario se obtiene de parámetros de consulta
      operationId: getCancellationLetter
      parameters:
        - name: addressedTo
          in: query
          required: true
          schema:
            type: string
            enum: ["SEÑORES", "SEÑORA", "SEÑOR"]
          description: Forma de dirigirse al destinatario
          example: "SEÑORES"
        - name: recipientName
          in: query
          required: true
          schema:
            type: string
            maxLength: 100
          description: Nombre del destinatario de la carta
          example: "Banco Nacional de Panamá"
      security:
        - ApiKeyAuth:
            - "/v1/whatsapp-customer-api/document-service/cancellation-letter:read"
        - BearerAuth: []
      responses:
        "200":
          description: Carta de cancelación disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentResponse"
        "400":
          description: Parámetros inválidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_params:
                  summary: Parámetros requeridos faltantes
                  value:
                    success: false
                    error: "MISSING_REQUIRED_PARAMS"
                    message: "Los parámetros addressedTo y recipientName son requeridos"
        "401":
          description: Token inválido o expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Crédito no cerrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                credit_not_closed:
                  summary: Crédito activo
                  value:
                    success: false
                    error: "CREDIT_NOT_CLOSED"
                    message: "No cuenta con un crédito cerrado para generar carta de cancelación"
                    details:
                      creditStatus: "active"
                      availableDocuments: ["balance_letter"]
        "404":
          description: Cliente o documento no encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit excedido - Siempre se toma en cuenta como error de límite de velocidad
