    # =====================================================
    # NUEVOS SCHEMAS PARA WHATSAPP CUSTOMER AUTH
    # =====================================================
    VerifyPhoneResponse:
      type: object
      required:
        - success
        - authType
        - message
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
        authType:
          type: integer
          enum: [1, 2]
          description: |
            Tipo de autenticación requerida:
            - 1: Cliente registrado (teléfono + cédula)
            - 2: Cliente no registrado (teléfono + cédula + fecha nacimiento + email)
        message:
          type: string
          description: Mensaje descriptivo del resultado
      additionalProperties: false
    AuthenticateResponse:
      type: object
      required:
        - success
        - authenticated
        - sessionToken
        - clientId
        - attemptsRemaining
        - message
      properties:
        success:
          type: boolean
          description: Indica si la operación fue procesada
        authenticated:
          type: boolean
          description: Indica si la autenticación fue exitosa
        sessionToken:
          type: string
          nullable: true
          description: JWT token para acceder a servicios de documentos (null si falla)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        clientId:
          type: string
          nullable: true
          description: ID único del cliente (null si falla)
          example: "12345"
        attemptsRemaining:
          type: integer
          description: Intentos restantes antes del bloqueo temporal
          minimum: 0
          maximum: 5
        message:
          type: string
          description: Mensaje descriptivo del resultado
        lockoutUntil:
          type: string
          format: date-time
          description: Fecha hasta cuando está bloqueada la cuenta (solo si está bloqueada)
          example: "2025-06-26T09:15:00Z"
      additionalProperties: false
    DocumentResponse:
      type: object
      required:
        - success
        - document
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
        document:
          type: object
          required:
            - type
            - downloadUrl
            - expiresAt
            - filename
            - generatedAt
          properties:
            type:
              type: string
              enum:
                [
                  "account_statement",
                  "last_payment",
                  "cancellation_letter",
                  "balance_letter",
                ]
              description: Tipo de documento generado
            downloadUrl:
              type: string
              format: uri
              description: URL temporal para descargar el PDF
              example: "https://s3.amazonaws.com/kubbesa-docs/temp/documento_123456789.pdf?expires=1719403200"
            expiresAt:
              type: string
              format: date-time
              description: Fecha y hora de expiración de la URL
              example: "2025-06-26T10:00:00Z"
            filename:
              type: string
              description: Nombre sugerido para el archivo
              example: "estado_cuenta_123456789.pdf"
            generatedAt:
              type: string
              format: date-time
              description: Fecha y hora de generación del documento
              example: "2025-06-25T08:30:00Z"
          additionalProperties: false
      additionalProperties: false
    OtpRequestBody:
      type: object
      required:
        - cedula
      properties:
        cedula:
          type: string
          pattern: "^[A-Za-z0-9\\-\\.\\s]+$"
          description: |
            Cédula exactamente como aparece en el documento físico:
            - Incluir guiones, puntos, letras según el documento original
            - Ejemplo: 8-123-456, PE-1-234-567, E-8-12345
          example: "8-123-456"
      additionalProperties: false
    OtpRequestResponse:
      type: object
      required:
        - success
        - otpSent
        - maskedEmail
        - expiresIn
        - maxRetries
        - message
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
        otpSent:
          type: boolean
          description: Indica si el OTP fue enviado correctamente
        maskedEmail:
          type: string
          description: Email ofuscado para confirmación del destinatario
          example: "leid******@gmail.com"
        expiresIn:
          type: integer
          description: Tiempo de expiración del OTP en segundos
          example: 300
        maxRetries:
          type: integer
          description: Máximo número de intentos de verificación
          example: 3
        message:
          type: string
          description: Mensaje descriptivo del resultado
      additionalProperties: false
    OtpVerifyBody:
      type: object
      required:
        - cedula
        - otp
      properties:
        cedula:
          type: string
          pattern: "^[A-Za-z0-9\\-\\.\\s]+$"
          description: |
            Cédula exactamente como aparece en el documento físico
          example: "8-123-456"
        otp:
          type: string
          pattern: "^[0-9]{4}$"
          description: |
            Código OTP de exactamente 6 dígitos enviado al email
          example: "1234"
      additionalProperties: false
    OtpVerifyResponse:
      type: object
      required:
        - success
        - otpValid
        - tempToken
        - attemptsRemaining
        - message
      properties:
        success:
          type: boolean
          description: Indica si la operación fue procesada
        otpValid:
          type: boolean
          description: Indica si el OTP ingresado es válido
        tempToken:
          type: string
          nullable: true
          description: Token temporal para continuar con autenticación completa (null si OTP inválido)
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
        attemptsRemaining:
          type: integer
          description: Intentos restantes antes de bloquear el OTP
          minimum: 0
          maximum: 3
        message:
          type: string
          description: Mensaje descriptivo del resultado
      additionalProperties: false
    OtpResendBody:
      type: object
      required:
        - cedula
      properties:
        cedula:
          type: string
          pattern: "^[A-Za-z0-9\\-\\.\\s]+$"
          description: |
            Cédula exactamente como aparece en el documento físico
          example: "8-123-456"
      additionalProperties: false
    OtpResendResponse:
      type: object
      required:
        - success
        - otpResent
        - maskedEmail
        - newExpiresIn
        - maxRetries
        - message
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
        otpResent:
          type: boolean
          description: Indica si el nuevo OTP fue enviado correctamente
        maskedEmail:
          type: string
          description: Email ofuscado para confirmación del destinatario
          example: "leid******@gmail.com"
        newExpiresIn:
          type: integer
          description: Tiempo de expiración del nuevo OTP en segundos
          example: 300
        maxRetries:
          type: integer
          description: Máximo número de intentos de verificación resetado
          example: 3
        message:
          type: string
          description: Mensaje descriptivo del resultado
      additionalProperties: false
    ErrorResponse:
      type: object
      required:
        - success
        - error
        - message
      properties:
        success:
          type: boolean
          description: Siempre false para errores
          example: false
        error:
          type: string
          description: Código de error específico
          enum:
            - "INVALID_PHONE_FORMAT"
            - "INVALID_CEDULA_FORMAT"
            - "INVALID_OTP_FORMAT"
            - "INVALID_API_KEY"
            - "INVALID_REQUEST_DATA"
            - "CUSTOMER_NOT_FOUND"
            - "CEDULA_NOT_FOUND"
            - "AUTHENTICATION_FAILED"
            - "AUTH_PHONE_NOT_FOUND"
            - "AUTH_DATA_MISMATCH"
            - "AUTH_MAX_ATTEMPTS"
            - "AUTH_ACCOUNT_LOCKED"
            - "OTP_MAX_ATTEMPTS"
            - "OTP_EXPIRED"
            - "NO_ACTIVE_OTP"
            - "DOCUMENT_NOT_AVAILABLE"
            - "NO_PAYMENTS_FOUND"
            - "CREDIT_NOT_CLOSED"
            - "CREDIT_NOT_ACTIVE"
            - "MISSING_REQUIRED_PARAMS"
            - "INVALID_SESSION_TOKEN"
            - "SESSION_EXPIRED"
            - "UNAUTHORIZED_ACCESS"
            - "RATE_LIMIT_EXCEEDED"
            - "INTERNAL_SERVER_ERROR"
        message:
          type: string
          description: Mensaje descriptivo del error para mostrar al usuario
        details:
          type: object
          description: Información adicional específica del error
          additionalProperties: true
      additionalProperties: false
    ErrorReportBody:
      type: object
      required:
        - errorDescription
      properties:
        errorDescription:
          type: string
          minLength: 1
          maxLength: 1000
          description: |
            Descripción detallada del error o problema experimentado
          example: "No me muestra mi último comprobante de pago cuando lo solicito desde WhatsApp"
        country:
          type: string
          pattern: "^[A-Z]{2}$"
          description: |
            Código de país ISO 2 letras (opcional, default: PA)
          example: "PA"
          default: "PA"
        channel:
          type: string
          enum: ["WhatsApp", "Web", "Mobile"]
          description: |
            Canal donde ocurrió el error (opcional, default: WhatsApp)
          example: "WhatsApp"
          default: "WhatsApp"
      additionalProperties: false
    ErrorReportResponse:
      type: object
      required:
        - success
        - document
      properties:
        success:
          type: boolean
          description: Indica si la operación fue exitosa
          example: true
        document:
          type: object
          required:
            - reportId
            - message
            - status
            - reportedAt
          properties:
            reportId:
              type: string
              description: ID único del reporte generado
              example: "6883a6145b492b8fe07920bd"
            message:
              type: string
              description: Mensaje de confirmación
              example: "Reporte de error guardado exitosamente"
            status:
              type: string
              enum: ["PENDING", "IN_REVIEW", "RESOLVED", "CLOSED"]
              description: Estado actual del reporte
              example: "PENDING"
            reportedAt:
              type: string
              format: date-time
              description: Fecha y hora del reporte
              example: "2025-07-25T15:43:16.880Z"
          additionalProperties: false
      additionalProperties: false
  # =====================================================
  # SECURITY SCHEMES
  # =====================================================
  securitySchemes:
    bearerHttpAuthentication:
      type: http
      scheme: Bearer
      bearerFormat: JWT
      description: |
        `JWT` Token en el header `Authorization`, el cual concede de la autenticación necesaria
        para consumir los recursos expuestos que requieren autenticación.
    defaultApiKey:
      type: apiKey
      name: X-API-Key
      in: header
      description: |
        API-Key proporcionada por Crediviva, la cual concede la autenticación necesaria
        para consumir los recursos expuestos que requieren autenticación.
    ApiKeyAuth:
      type: apiKey
      name: X-API-Key
      in: header
      description: >
        API-Key proporcionada por Crediviva, la cual concede la autenticación necesaria 
        para consumir los recursos expuestos. Cada proveedor (Chattigo, Twilio, etc.) 
        recibe una API Key única.
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token JWT obtenido del endpoint de autenticación de clientes. Requerido 
        para acceder a los servicios de documentos.
